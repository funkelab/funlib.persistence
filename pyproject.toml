[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[project]
name = "funlib.persistence"
description = "Interfaces for data (arrays and graphs) and storage formats (databases and file formats)"
license = { text = "MIT" }
readme = "README.md"
authors = [
    { name = "William Patton", email = "pattonw@hhmi.org" },
    { name = "Jan Funke", email = "funkej@hhmi.org" },
]
dynamic = ['version']

requires-python = ">=3.11"
classifiers = ["Programming Language :: Python :: 3"]
keywords = []

dependencies = [
    "zarr>=3,<4",
    "iohub>=0.3.0a5",
    "funlib.geometry>=0.3.0",
    "networkx>=3.0.0",
    "pymongo>=4.0.0",
    "numpy>=2.0.0",
    "pydantic>=2.0.0",
    "dask>=2024.0.0",
    "toml>=0.10.0",
    "psycopg2-binary>=2.9.11",
]

[tool.setuptools.dynamic]
version = { attr = "funlib.persistence.__version__" }

[dependency-groups]
# Installed by `uv sync` (PEP 735); not part of the published package.
# ruff and ty are pinned with == until uv.lock is committed: both change
# their rule sets between releases.
dev = [
    "coverage>=7.7.1",
    "pytest>=8.3.5",
    "pytest-cov>=6",
    "pytest-mock>=3.14.0",
    "ruff==0.17.3",
    "ty==0.0.96",
    "types-networkx",
    "types-psycopg2",
    "types-toml",
]

[tool.setuptools.package-data]
"funlib.persistence" = ["py.typed"]

# # module specific overrides
[[tool.mypy.overrides]]
module = ["zarr.*", "iohub.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
extend-exclude = ["docs/build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"tutorials/**/*.py" = ["E402"]  # jupytext cells import mid-file
"examples/**/*.py" = ["E402"]
"__init__.py" = ["F401"]  # re-exports
